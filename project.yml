name: MedKey
options:
  bundleIdPrefix: org.medkey.local
  deploymentTarget:
    iOS: '16.0'
packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    exactVersion: 0.11.2
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  MedKey:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.medkey.local.MedKey
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: MedKey
        CFBundleName: MedKey
        UILaunchScreen: {}
    dependencies:
      - target: MedKeyKeyboard
        embed: true
      - sdk: libsqlite3.tbd
  MedKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.medkey.local.MedKey.Keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: MedKey Keyboard
        CFBundleName: MedKeyKeyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: false
            PrefersRightToLeft: false
    dependencies:
      - sdk: libsqlite3.tbd
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
  MedKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Keyboard
      - Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MedKey.app/MedKey
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: MedKey
      - sdk: libsqlite3.tbd
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
schemes:
  MedKey:
    build:
      targets:
        MedKey: all
    test:
      targets:
        - MedKeyTests
