name: Build iPhone prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: |
          touch Resources/ThirdPartyNotices.txt
          xcodegen generate
      - name: Resolve conversion engine and collect licenses
        run: |
          xcodebuild -resolvePackageDependencies -project MedKey.xcodeproj -scheme MedKey -clonedSourcePackagesDirPath .packages
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.packages/checkouts')
          notices = ['MedKey uses AzooKeyKanaKanjiConverter v0.11.2 and its default dictionary.\nhttps://github.com/azooKey/AzooKeyKanaKanjiConverter\nThe upstream source is unmodified.\n']
          for path in sorted(root.rglob('*')):
              if path.is_file() and any(path.name.lower().startswith(name) for name in ('license', 'licence', 'copying', 'notice', 'authors', 'readme')):
                  notices.append('\n===== ' + str(path.relative_to(root)) + ' =====\n' + path.read_text(errors='replace'))
          assert len(notices) > 5, 'Dependency licenses were not found'
          Path('Resources/ThirdPartyNotices.txt').write_text('\n'.join(notices))
          PY
      - name: Build for simulator
        run: >-
          xcodebuild -project MedKey.xcodeproj -scheme MedKey
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-simulator
          -clonedSourcePackagesDirPath .packages
          CODE_SIGNING_ALLOWED=NO build
      - name: Test everyday conversion and kana layout
        timeout-minutes: 8
        run: |
          SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export SIMULATOR_SDK
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); suffix=".iOS-"+os.environ["SIMULATOR_SDK"].replace(".","-"); print(next(x["udid"] for runtime,group in d["devices"].items() if runtime.endswith(suffix) for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -project MedKey.xcodeproj -scheme MedKey -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -destination-timeout 60 -derivedDataPath build-simulator -clonedSourcePackagesDirPath .packages -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Build for iPhone without signing
        run: >-
          xcodebuild -project MedKey.xcodeproj -scheme MedKey
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          -clonedSourcePackagesDirPath .packages
          CODE_SIGNING_ALLOWED=NO build
      - name: Package for personal signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          app = Path('build-device/Build/Products/Release-iphoneos/MedKey.app')
          keyboard = next(app.glob('PlugIns/*.appex'))
          for bundle in (app, keyboard):
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              assert info['CFBundleDisplayName'].isascii(), 'AltStore requires an ASCII app name'
              assert (bundle / 'medical.sqlite').is_file(), 'Medical dictionary missing'
          assert any(keyboard.rglob('Dictionary')), 'General Japanese dictionary missing from keyboard extension'
          assert (app / 'ThirdPartyNotices.txt').stat().st_size > 1000
          PY
          mkdir -p Package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/MedKey.app Package/Payload/
          cd Package
          zip -r ../MedKey-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MedKey-unsigned-IPA
          path: MedKey-unsigned.ipa
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MedKey-test-results
          path: TestResults.xcresult
          retention-days: 3
