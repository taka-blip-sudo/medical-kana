name: Build iPhone prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: >-
          xcodebuild -project MedKey.xcodeproj -scheme MedKey
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-simulator
          CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone without signing
        run: >-
          xcodebuild -project MedKey.xcodeproj -scheme MedKey
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO build
      - name: Package for personal signing
        run: |
          mkdir -p Package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/MedKey.app Package/Payload/
          cd Package
          zip -r ../MedKey-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MedKey-unsigned-IPA
          path: MedKey-unsigned.ipa
          retention-days: 3
